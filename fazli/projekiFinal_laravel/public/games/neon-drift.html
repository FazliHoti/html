<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Drift</title>
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      height: 100%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #4c1d95, #020617 62%);
      color: white;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: min(620px, calc(100vw - 24px));
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      background: rgba(2,6,23,0.88);
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      font-weight: 800;
    }
    canvas {
      display: block;
      width: 100%;
      height: min(470px, calc(100vh - 86px));
      background: #020617;
    }
    .controls {
      padding: 10px 14px 12px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="hud">
      <span>Neon Drift</span>
      <span>Score: <span id="score">0</span></span>
    </div>
    <canvas id="game" width="620" height="470"></canvas>
    <div class="controls">Use Left / Right or A / D to change lanes. Click after a crash to restart.</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const laneCenters = [170, 310, 450];
    let lane = 1;
    let targetX = laneCenters[lane];
    let carX = targetX;
    let obstacles = [];
    let roadOffset = 0;
    let score = 0;
    let speed = 4;
    let spawn = 0;
    let running = true;

    function reset() {
      lane = 1;
      targetX = laneCenters[lane];
      carX = targetX;
      obstacles = [];
      roadOffset = 0;
      score = 0;
      speed = 4;
      spawn = 0;
      running = true;
      scoreEl.textContent = score;
    }

    function move(direction) {
      if (!running) return;
      lane = Math.max(0, Math.min(2, lane + direction));
      targetX = laneCenters[lane];
    }

    function update() {
      if (!running) return;
      roadOffset = (roadOffset + speed) % 54;
      carX += (targetX - carX) * 0.22;
      spawn -= 1;
      if (spawn <= 0) {
        const badLane = Math.floor(Math.random() * 3);
        obstacles.push({ lane: badLane, x: laneCenters[badLane], y: -70, w: 54, h: 82 });
        spawn = Math.max(28, 70 - Math.floor(score / 120));
      }

      obstacles.forEach((obstacle) => obstacle.y += speed);
      obstacles = obstacles.filter((obstacle) => {
        if (obstacle.y > canvas.height + 90) {
          score += 10;
          scoreEl.textContent = score;
          speed = Math.min(8, speed + 0.06);
          return false;
        }
        return true;
      });

      const player = { x: carX, y: canvas.height - 72, w: 48, h: 76 };
      for (const obstacle of obstacles) {
        const hit = Math.abs(player.x - obstacle.x) < (player.w + obstacle.w) / 2 &&
          Math.abs(player.y - obstacle.y) < (player.h + obstacle.h) / 2;
        if (hit) running = false;
      }
    }

    function drawCar(x, y, color) {
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
      ctx.fillRect(x - 24, y - 38, 48, 76);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(x - 14, y - 25, 28, 18);
      ctx.shadowBlur = 0;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#08111f';
      ctx.beginPath();
      ctx.moveTo(110, 0);
      ctx.lineTo(510, 0);
      ctx.lineTo(560, canvas.height);
      ctx.lineTo(60, canvas.height);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 3;
      [240, 380].forEach((x) => {
        for (let y = -54 + roadOffset; y < canvas.height; y += 54) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y + 28);
          ctx.stroke();
        }
      });

      obstacles.forEach((obstacle) => drawCar(obstacle.x, obstacle.y, '#fb7185'));
      drawCar(carX, canvas.height - 72, '#34d399');

      if (!running) {
        ctx.fillStyle = 'rgba(2,6,23,0.74)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '800 34px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Crash!', canvas.width / 2, canvas.height / 2);
        ctx.font = '700 15px Arial';
        ctx.fillText('Click to restart', canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft' || event.key === 'a') {
        event.preventDefault();
        move(-1);
      }
      if (event.key === 'ArrowRight' || event.key === 'd') {
        event.preventDefault();
        move(1);
      }
    });
    canvas.addEventListener('click', () => { if (!running) reset(); });
    reset();
    loop();
  </script>
</body>
</html>
