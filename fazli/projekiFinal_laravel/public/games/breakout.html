<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breakout</title>
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }
    .panel {
      max-height: 100vh;
      background: #111827;
      border-radius: 18px;
      padding: clamp(8px, 2vh, 18px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 700;
    }
    canvas {
      display: block;
      width: min(480px, calc(100vw - 36px), calc((100vh - 80px) * 1.5));
      height: auto;
      background: #020617;
      border: 2px solid #334155;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="hud">
      <span>Breakout</span>
      <span>Score: <strong id="score">0</strong></span>
    </div>
    <canvas id="game" width="480" height="320"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    const paddle = {
      width: 90,
      height: 12,
      x: canvas.width / 2 - 45,
      y: canvas.height - 20,
      speed: 7
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 8,
      dx: 4,
      dy: -4
    };

    let score = 0;
    let gameRunning = true;
    const bricks = [];

    function buildBricks() {
      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 8; col++) {
          bricks.push({
            x: 10 + col * 56,
            y: 20 + row * 24,
            w: 46,
            h: 16,
            alive: true
          });
        }
      }
    }

    function drawPaddle() {
      ctx.fillStyle = '#22d3ee';
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();
    }

    function drawBricks() {
      bricks.forEach(brick => {
        if (!brick.alive) return;
        ctx.fillStyle = ['#f59e0b', '#34d399', '#f472b6', '#a78bfa'][Math.floor((brick.x + brick.y) / 20) % 4];
        ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
      });
    }

    function updateScore() {
      scoreEl.textContent = score;
    }

    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.dx = (Math.random() > 0.5 ? 1 : -1) * 4;
      ball.dy = -4;
    }

    function update() {
      if (!gameRunning) return;

      if (leftPressed && paddle.x > 0) paddle.x -= paddle.speed;
      if (rightPressed && paddle.x + paddle.width < canvas.width) paddle.x += paddle.speed;

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.x + ball.radius >= canvas.width || ball.x - ball.radius <= 0) ball.dx *= -1;
      if (ball.y - ball.radius <= 0) ball.dy *= -1;

      if (ball.y + ball.radius >= paddle.y && ball.y - ball.radius <= paddle.y + paddle.height &&
          ball.x >= paddle.x && ball.x <= paddle.x + paddle.width) {
        ball.dy = -Math.abs(ball.dy);
      }

      if (ball.y - ball.radius > canvas.height) {
        resetBall();
      }

      bricks.forEach(brick => {
        if (!brick.alive) return;
        const hitBrick =
          ball.x > brick.x &&
          ball.x < brick.x + brick.w &&
          ball.y > brick.y &&
          ball.y < brick.y + brick.h;

        if (hitBrick) {
          brick.alive = false;
          ball.dy *= -1;
          score += 10;
          updateScore();
        }
      });

      const allCleared = bricks.every(brick => !brick.alive);
      if (allCleared) {
        alert('You win!');
        bricks.splice(0, bricks.length);
        buildBricks();
        score = 0;
        updateScore();
        resetBall();
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawPaddle();
      drawBall();
    }

    let leftPressed = false;
    let rightPressed = false;

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') event.preventDefault();
      if (event.key === 'ArrowLeft') leftPressed = true;
      if (event.key === 'ArrowRight') rightPressed = true;
    });

    document.addEventListener('keyup', (event) => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') event.preventDefault();
      if (event.key === 'ArrowLeft') leftPressed = false;
      if (event.key === 'ArrowRight') rightPressed = false;
    });

    buildBricks();
    updateScore();
    resetBall();
    draw();
    requestAnimationFrame(update);
  </script>
</body>
</html>
