<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Game</title>
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      height: 100%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 0%, #172554, #020617 62%);
      color: white;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: min(760px, calc(100vw - 24px));
      max-height: calc(100vh - 20px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      background: rgba(2, 6, 23, 0.86);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      font-weight: 800;
    }
    .meta {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
    }
    canvas {
      display: block;
      width: 100%;
      height: min(450px, calc(100vh - 96px));
      background: #020617;
    }
    .controls {
      padding: 10px 14px 12px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="hud">
      <div>
        <span id="title">Arcade Run</span>
        <div class="meta" id="subtitle">Move, dodge, and score points.</div>
      </div>
      <div>Score: <span id="score">0</span></div>
    </div>
    <canvas id="game" width="760" height="450"></canvas>
    <div class="controls">Move with arrow keys or WASD. Press Space to fire. Click to restart after game over.</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get('title') || 'Arcade Run';
    const mode = params.get('mode') || 'shooter';
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const scoreEl = document.getElementById('score');
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    titleEl.textContent = title;
    subtitleEl.textContent = mode === 'runner'
      ? 'Slip through neon traffic and collect energy.'
      : 'Blast incoming targets before they reach you.';

    const keys = new Set();
    let player;
    let shots;
    let targets;
    let particles;
    let score;
    let spawnTimer;
    let running;
    let lastShot;

    function reset() {
      player = { x: canvas.width / 2, y: canvas.height - 58, w: 34, h: 34, speed: 6 };
      shots = [];
      targets = [];
      particles = [];
      score = 0;
      spawnTimer = 0;
      running = true;
      lastShot = 0;
      scoreEl.textContent = score;
    }

    function spawnTarget() {
      const size = mode === 'runner' ? 38 : 28 + Math.random() * 16;
      targets.push({
        x: 28 + Math.random() * (canvas.width - 56),
        y: -size,
        w: size,
        h: size,
        speed: mode === 'runner' ? 3.2 + Math.random() * 2.3 : 1.8 + Math.random() * 2.2,
        hue: mode === 'runner' ? 42 : 185 + Math.random() * 130
      });
    }

    function shoot() {
      const now = performance.now();
      if (now - lastShot < 170) return;
      lastShot = now;
      shots.push({ x: player.x, y: player.y - 18, r: 4, speed: 9 });
    }

    function hit(a, b) {
      return a.x - a.w / 2 < b.x + b.w / 2 &&
        a.x + a.w / 2 > b.x - b.w / 2 &&
        a.y - a.h / 2 < b.y + b.h / 2 &&
        a.y + a.h / 2 > b.y - b.h / 2;
    }

    function pop(x, y, hue) {
      for (let index = 0; index < 12; index++) {
        particles.push({
          x,
          y,
          dx: (Math.random() - 0.5) * 5,
          dy: (Math.random() - 0.5) * 5,
          life: 24,
          hue
        });
      }
    }

    function update() {
      if (!running) return;

      if (keys.has('ArrowLeft') || keys.has('a')) player.x -= player.speed;
      if (keys.has('ArrowRight') || keys.has('d')) player.x += player.speed;
      if (keys.has('ArrowUp') || keys.has('w')) player.y -= player.speed;
      if (keys.has('ArrowDown') || keys.has('s')) player.y += player.speed;
      if (keys.has(' ')) shoot();

      player.x = Math.max(22, Math.min(canvas.width - 22, player.x));
      player.y = Math.max(canvas.height * 0.42, Math.min(canvas.height - 26, player.y));

      spawnTimer -= 1;
      if (spawnTimer <= 0) {
        spawnTarget();
        spawnTimer = Math.max(16, 42 - Math.floor(score / 80));
      }

      shots.forEach((shot) => shot.y -= shot.speed);
      shots = shots.filter((shot) => shot.y > -20);

      targets.forEach((target) => target.y += target.speed);

      if (mode === 'runner') {
        targets.forEach((target) => {
          if (target.y > canvas.height + 40) {
            target.y = -target.h;
            target.x = 28 + Math.random() * (canvas.width - 56);
            score += 5;
            scoreEl.textContent = score;
          }
        });
      } else {
        targets = targets.filter((target) => target.y < canvas.height + 50);
      }

      for (const target of targets) {
        if (hit({ ...player, w: player.w, h: player.h }, target)) {
          running = false;
          pop(player.x, player.y, 340);
        }
      }

      for (const shot of shots) {
        for (const target of targets) {
          const bulletBox = { x: shot.x, y: shot.y, w: shot.r * 2, h: shot.r * 2 };
          if (!target.dead && hit(bulletBox, target)) {
            target.dead = true;
            shot.dead = true;
            score += mode === 'runner' ? 3 : 10;
            scoreEl.textContent = score;
            pop(target.x, target.y, target.hue);
          }
        }
      }

      shots = shots.filter((shot) => !shot.dead);
      targets = targets.filter((target) => !target.dead);

      particles.forEach((particle) => {
        particle.x += particle.dx;
        particle.y += particle.dy;
        particle.life -= 1;
      });
      particles = particles.filter((particle) => particle.life > 0);
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.lineTo(20, 18);
      ctx.lineTo(0, 9);
      ctx.lineTo(-20, 18);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(34, 211, 238, 0.13)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 38) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x - 80, canvas.height);
        ctx.stroke();
      }

      shots.forEach((shot) => {
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, shot.r, 0, Math.PI * 2);
        ctx.fill();
      });

      targets.forEach((target) => {
        ctx.fillStyle = `hsl(${target.hue}, 90%, 58%)`;
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 16;
        ctx.fillRect(target.x - target.w / 2, target.y - target.h / 2, target.w, target.h);
        ctx.shadowBlur = 0;
      });

      particles.forEach((particle) => {
        ctx.fillStyle = `hsla(${particle.hue}, 90%, 62%, ${particle.life / 24})`;
        ctx.fillRect(particle.x, particle.y, 4, 4);
      });

      drawPlayer();

      if (!running) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.74)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '800 36px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game over', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '700 16px Arial';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText('Click to restart', canvas.width / 2, canvas.height / 2 + 24);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (event) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(event.key)) {
        event.preventDefault();
      }
      keys.add(event.key);
    });

    document.addEventListener('keyup', (event) => keys.delete(event.key));
    canvas.addEventListener('click', () => {
      if (!running) reset();
    });

    reset();
    loop();
  </script>
</body>
</html>
