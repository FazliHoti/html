<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }
    .panel {
      max-height: 100vh;
      background: #111827;
      border-radius: 18px;
      padding: clamp(8px, 2vh, 18px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 700;
    }
    canvas {
      display: block;
      width: auto;
      height: min(600px, calc(100vh - 80px));
      max-width: calc(100vw - 36px);
      background: #020617;
      border: 2px solid #334155;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="hud">
      <span>Tetris</span>
      <span>Score: <strong id="score">0</strong></span>
    </div>
    <canvas id="game" width="300" height="600"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const colors = ['#38bdf8', '#a78bfa', '#fbbf24', '#34d399', '#f87171', '#f472b6', '#facc15'];
    const board = Array.from({ length: 20 }, () => Array(10).fill(0));
    const pieces = {
      I: [[1,1,1,1]],
      J: [[1,0,0],[1,1,1]],
      L: [[0,0,1],[1,1,1]],
      O: [[1,1],[1,1]],
      S: [[0,1,1],[1,1,0]],
      T: [[0,1,0],[1,1,1]],
      Z: [[1,1,0],[0,1,1]]
    };

    let current = null;
    let score = 0;
    let dropInterval = 500;
    let lastTime = 0;
    let dropTimer = 0;

    function randomPiece() {
      const keys = Object.keys(pieces);
      const name = keys[Math.floor(Math.random() * keys.length)];
      const matrix = pieces[name].map(row => row.slice());
      return {
        name,
        matrix,
        x: Math.floor((10 - matrix[0].length) / 2),
        y: -1,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function collides(matrix, offsetX, offsetY) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) continue;
          const boardX = x + offsetX;
          const boardY = y + offsetY;
          if (boardX < 0 || boardX >= 10 || boardY >= 20) return true;
          if (boardY >= 0 && board[boardY][boardX]) return true;
        }
      }
      return false;
    }

    function merge() {
      current.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            const boardY = current.y + y;
            const boardX = current.x + x;
            if (boardY >= 0) board[boardY][boardX] = current.color;
          }
        });
      });

      clearLines();
      current = randomPiece();
      if (collides(current.matrix, current.x, current.y)) {
        alert('Game over!');
        board.forEach((row, rowIndex) => row.fill(0));
        score = 0;
        scoreEl.textContent = score;
        current = randomPiece();
      }
    }

    function clearLines() {
      let linesCleared = 0;
      for (let y = board.length - 1; y >= 0; y--) {
        if (board[y].every(cell => cell)) {
          board.splice(y, 1);
          board.unshift(Array(10).fill(0));
          linesCleared++;
          y++;
        }
      }
      if (linesCleared) {
        score += linesCleared * 100;
        scoreEl.textContent = score;
      }
    }

    function rotateMatrix(matrix) {
      return matrix[0].map((_, index) => matrix.map(row => row[index]).reverse());
    }

    function movePiece(direction) {
      if (!current) return;
      const nextX = current.x + direction;
      if (!collides(current.matrix, nextX, current.y)) current.x = nextX;
    }

    function dropPiece() {
      if (!current) current = randomPiece();
      if (!collides(current.matrix, current.x, current.y + 1)) {
        current.y += 1;
      } else {
        merge();
      }
    }

    function rotatePiece() {
      if (!current) return;
      const rotated = rotateMatrix(current.matrix);
      const kicks = [0, -1, 1, -2, 2];
      for (const kick of kicks) {
        if (!collides(rotated, current.x + kick, current.y)) {
          current.matrix = rotated;
          current.x += kick;
          return;
        }
      }
    }

    function drawSquare(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * 30, y * 30, 30, 30);
      ctx.strokeStyle = '#0f172a';
      ctx.strokeRect(x * 30, y * 30, 30, 30);
    }

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < 20; y++) {
        for (let x = 0; x < 10; x++) {
          if (board[y][x]) drawSquare(x, y, board[y][x]);
          else {
            ctx.strokeStyle = '#1e293b';
            ctx.strokeRect(x * 30, y * 30, 30, 30);
          }
        }
      }

      if (current) {
        current.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value) {
              drawSquare(current.x + x, current.y + y, current.color);
            }
          });
        });
      }
    }

    document.addEventListener('keydown', (event) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(event.key)) event.preventDefault();
      if (event.key === 'ArrowLeft') movePiece(-1);
      if (event.key === 'ArrowRight') movePiece(1);
      if (event.key === 'ArrowDown') dropPiece();
      if (event.key === 'ArrowUp') rotatePiece();
      if (event.key === ' ') {
        event.preventDefault();
        rotatePiece();
      }
    });

    function update(time = 0) {
      const delta = time - lastTime;
      lastTime = time;
      dropTimer += delta;

      if (dropTimer > dropInterval) {
        dropPiece();
        dropTimer = 0;
      }

      drawBoard();
      requestAnimationFrame(update);
    }

    current = randomPiece();
    update();
  </script>
</body>
</html>
