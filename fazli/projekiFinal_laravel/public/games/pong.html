<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      height: 100%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #164e63, #020617 62%);
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: min(760px, calc(100vw - 24px));
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      background: rgba(2,6,23,0.86);
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-weight: 800;
    }
    canvas {
      display: block;
      width: 100%;
      height: min(430px, calc(100vh - 86px));
      background: #020617;
    }
    .controls {
      padding: 10px 14px 12px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="hud">
      <span>Pong</span>
      <span>You <span id="player">0</span> : <span id="cpu">0</span> CPU</span>
    </div>
    <canvas id="game" width="760" height="430"></canvas>
    <div class="controls">Move with Arrow Up / Arrow Down or W / S.</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const playerEl = document.getElementById('player');
    const cpuEl = document.getElementById('cpu');
    const keys = new Set();
    const player = { x: 26, y: 170, w: 14, h: 90, score: 0 };
    const cpu = { x: canvas.width - 40, y: 170, w: 14, h: 90, score: 0 };
    const ball = { x: 380, y: 215, r: 9, vx: 5, vy: 3.2 };

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = direction * (4.5 + Math.random() * 1.5);
      ball.vy = (Math.random() > 0.5 ? 1 : -1) * (2.6 + Math.random() * 2.2);
    }

    function update() {
      if (keys.has('ArrowUp') || keys.has('w')) player.y -= 7;
      if (keys.has('ArrowDown') || keys.has('s')) player.y += 7;
      player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

      const cpuCenter = cpu.y + cpu.h / 2;
      cpu.y += Math.sign(ball.y - cpuCenter) * 4.8;
      cpu.y = Math.max(0, Math.min(canvas.height - cpu.h, cpu.y));

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y - ball.r <= 0 || ball.y + ball.r >= canvas.height) {
        ball.vy *= -1;
      }

      [player, cpu].forEach((paddle) => {
        const touching = ball.x + ball.r > paddle.x &&
          ball.x - ball.r < paddle.x + paddle.w &&
          ball.y + ball.r > paddle.y &&
          ball.y - ball.r < paddle.y + paddle.h;
        if (touching) {
          const offset = (ball.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2);
          ball.vx = Math.abs(ball.vx) * (paddle === player ? 1 : -1) * 1.04;
          ball.vy = offset * 5.5;
        }
      });

      if (ball.x < -20) {
        cpu.score += 1;
        cpuEl.textContent = cpu.score;
        resetBall(1);
      }
      if (ball.x > canvas.width + 20) {
        player.score += 1;
        playerEl.textContent = player.score;
        resetBall(-1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#22d3ee';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = '#f472b6';
      ctx.fillRect(cpu.x, cpu.y, cpu.w, cpu.h);
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown'].includes(event.key)) event.preventDefault();
      keys.add(event.key);
    });
    document.addEventListener('keyup', (event) => keys.delete(event.key));
    loop();
  </script>
</body>
</html>
