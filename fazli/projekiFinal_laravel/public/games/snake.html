<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }
    .panel {
      max-height: 100vh;
      background: #111827;
      border-radius: 18px;
      padding: clamp(8px, 2vh, 18px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
    }
    canvas {
      display: block;
      width: min(400px, calc(100vw - 36px), calc(100vh - 110px));
      height: auto;
      background: #020617;
      border-radius: 10px;
      border: 2px solid #334155;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: #22d3ee;
      color: #111827;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="hud">
      <span>Snake</span>
      <span>Score: <strong id="score">0</strong></span>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div style="text-align:center;"><button id="restart">Restart</button></div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const restartBtn = document.getElementById('restart');
    const tile = 20;
    const tileCount = canvas.width / tile;
    let snake;
    let direction;
    let nextDirection;
    let food;
    let score = 0;
    let gameLoop;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      placeFood();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(loop, 120);
    }

    function placeFood() {
      let x = Math.floor(Math.random() * tileCount);
      let y = Math.floor(Math.random() * tileCount);
      while (snake.some(segment => segment.x === x && segment.y === y)) {
        x = Math.floor(Math.random() * tileCount);
        y = Math.floor(Math.random() * tileCount);
      }
      food = { x, y };
    }

    function loop() {
      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0 || head.y < 0 || head.x >= tileCount || head.y >= tileCount) {
        clearInterval(gameLoop);
        alert('Game over!');
        return;
      }

      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        clearInterval(gameLoop);
        alert('Game over!');
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#22d3ee';
      snake.forEach(segment => {
        ctx.fillRect(segment.x * tile, segment.y * tile, tile - 1, tile - 1);
      });

      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(food.x * tile, food.y * tile, tile - 1, tile - 1);
    }

    document.addEventListener('keydown', (event) => {
      const map = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }
      };
      const next = map[event.key];
      if (!next) return;
      event.preventDefault();
      const isReverse = next.x === -direction.x && next.y === -direction.y;
      if (!isReverse) nextDirection = next;
    });

    restartBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
